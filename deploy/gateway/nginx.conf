# Netrun terminates HTTPS; only web:8080 is published.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}
# Express trusts only this last proxy. The hosting ingress must overwrite X-Forwarded-For.
map $http_x_forwarded_for $original_client {
    "" $remote_addr;
    default $http_x_forwarded_for;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    location = /adminer { return 302 /adminer/; }
    location /adminer/ {
        auth_basic "Nexcent database";
        auth_basic_user_file /etc/nginx/adminer.htpasswd;
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $original_client;
        proxy_hide_header X-Powered-By;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $original_client;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
